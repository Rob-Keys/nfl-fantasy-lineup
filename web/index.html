<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NFL fantasy lineup generator" />
    <title>NFL Fantasy Lineup</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Fantasy football</p>
        <h1>Build your lineup</h1>
        <p class="lede">Search your players, select your roster, and send it to the lineup engine.</p>
      </header>

      <section class="card" aria-labelledby="player-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Roster</p>
            <h2 id="player-heading">Select players</h2>
          </div>
          <span id="selected-count" class="count">0 selected</span>
        </div>

        <label class="search-label" for="player-search">Search by name, position, or team</label>
        <input id="player-search" type="search" placeholder="Try Josh Allen or QB" autocomplete="off" />
        <div id="player-results" class="player-list" aria-live="polite"></div>
        <p id="player-status" class="muted">Loading player catalog…</p>
      </section>

      <section class="card" aria-labelledby="selected-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Request</p>
            <h2 id="selected-heading">Your selected players</h2>
          </div>
        </div>
        <div id="selected-players" class="selected-list"></div>
        <button id="submit-lineup" type="button" disabled>Generate lineup</button>
        <p id="request-status" class="status" role="status"></p>
        <pre id="request-result" class="result" hidden></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
